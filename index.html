<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>The Selected Archive</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3rem 1.5rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    main {
      margin: auto 0;
      max-width: 650px;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    p.description {
      font-size: 1.1rem;
      font-weight: 300;
      color: #cccccc;
      letter-spacing: 0.02em;
      line-height: 1.6;
    }
    footer {
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }
    footer a {
      color: #888888;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    footer a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header></header>

  <main>
    <h1>The Selected Archive</h1>
    <p class="description">Una selección absoluta de los discos que definieron el género.</p>
  </main>

  <footer>
    <a href="mailto:info@theselectedarchive.com">info@theselectedarchive.com</a>
  </footer>

</body>
</html>
